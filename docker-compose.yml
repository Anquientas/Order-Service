x-app-environment: &app-environment
  POSTGRES_DATABASE_NAME: ${POSTGRES_DATABASE_NAME}
  POSTGRES_USERNAME: ${POSTGRES_USERNAME}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  CAPASHINO_BASE_URL: ${CAPASHINO_BASE_URL}
  CAPASHINO_API_KEY: ${CAPASHINO_API_KEY}
  ORDER_SERVICE_CALLBACK_BASE_URL: ${ORDER_SERVICE_CALLBACK_BASE_URL}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-order-service}
  KAFKA_OUTBOX_ATTEMPTS_MAX: ${KAFKA_OUTBOX_ATTEMPTS_MAX:-5}
  KAFKA_OUTBOX_BATCH_LIMIT: ${KAFKA_OUTBOX_BATCH_LIMIT:-50}
  KAFKA_OUTBOX_DISPATCH_INTERVAL_SECONDS: ${KAFKA_OUTBOX_DISPATCH_INTERVAL_SECONDS:-5.0}
  NOTIFICATION_OUTBOX_ATTEMPTS_MAX: ${NOTIFICATION_OUTBOX_ATTEMPTS_MAX:-5}
  NOTIFICATION_OUTBOX_BATCH_LIMIT: ${NOTIFICATION_OUTBOX_BATCH_LIMIT:-50}
  NOTIFICATION_OUTBOX_DISPATCH_INTERVAL_SECONDS: ${NOTIFICATION_OUTBOX_DISPATCH_INTERVAL_SECONDS:-5.0}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      - db

  worker:
    build: .
    environment:
      <<: *app-environment
    depends_on:
      - db
      - api
    command: ["python", "bin/outbox_worker.py"]

volumes:
  db_data: